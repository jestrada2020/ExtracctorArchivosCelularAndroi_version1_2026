<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182230"/>
      <stop offset="100%" stop-color="#0b0f15"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7849"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Phone Body -->
  <rect x="90" y="110" width="160" height="292" rx="32" fill="#1e293b" stroke="url(#phoneGrad)" stroke-width="8" filter="url(#glow)"/>
  <!-- Phone Screen -->
  <rect x="108" y="145" width="124" height="215" rx="14" fill="#0f172a"/>
  <!-- Phone Speaker -->
  <line x1="150" y1="126" x2="190" y2="126" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <!-- Phone Home Indicator -->
  <circle cx="170" cy="380" r="8" fill="#334155"/>

  <!-- Files on Phone Screen -->
  <rect x="122" y="165" width="42" height="34" rx="6" fill="#38bdf8" opacity="0.85"/>
  <rect x="174" y="165" width="44" height="34" rx="6" fill="#f43f5e" opacity="0.85"/>
  <rect x="122" y="210" width="42" height="34" rx="6" fill="#a855f7" opacity="0.85"/>
  <rect x="174" y="210" width="44" height="34" rx="6" fill="#10b981" opacity="0.85"/>

  <!-- Storage Meter Mini -->
  <rect x="122" y="265" width="96" height="8" rx="4" fill="#1e293b"/>
  <rect x="122" y="265" width="68" height="8" rx="4" fill="url(#phoneGrad)"/>

  <!-- Laptop / PC Target Body -->
  <rect x="270" y="170" width="165" height="110" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="6"/>
  <!-- Laptop Screen -->
  <rect x="282" y="182" width="141" height="86" rx="6" fill="#090d13"/>
  <!-- Folder on PC Screen -->
  <path d="M 310 205 L 330 205 L 340 216 L 395 216 A 4 4 0 0 1 399 220 L 399 252 A 4 4 0 0 1 395 256 L 310 256 A 4 4 0 0 1 306 252 L 306 209 A 4 4 0 0 1 310 205 Z" fill="#eab308"/>
  <!-- Laptop Base -->
  <path d="M 245 280 L 460 280 L 440 296 L 265 296 Z" fill="#475569"/>

  <!-- Transfer Flow / Arrow -->
  <path d="M 215 310 C 265 310, 275 350, 335 350" fill="none" stroke="url(#arrowGrad)" stroke-width="8" stroke-dasharray="10 6" stroke-linecap="round"/>
  <!-- Arrow Head -->
  <polygon points="330,336 360,350 330,364" fill="url(#arrowGrad)"/>

  <!-- Badge MTP -->
  <rect x="290" y="380" width="120" height="34" rx="10" fill="#ff7849"/>
  <text x="350" y="403" font-family="sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">MTP</text>
</svg>
